version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: lughx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lughx_admin
      POSTGRES_PASSWORD: lughx_secure_pass
      POSTGRES_DB: lughx_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: lughx-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: